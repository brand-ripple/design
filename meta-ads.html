<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

  <!-- Gallery header -->
  <header class="page-header">
    <div class="brand-row">
      <!-- Brand logo: tree/face silhouette + lowercase wordmark -->
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Face profile -->
        <path d="M32 58c-10 0-14-5-14-12 0-4 2-6 2-10 0-3-2-5-2-9 0-8 6-14 14-14 7 0 12 5 12 12 0 4-2 6-2 9 0 4 2 6 2 10 0 7-4 14-12 14z"

          <circle cx="30" cy="12" r="6"/>
          <circle cx="38" cy="18" r="7"/>
          <circle cx="18" cy="28" r="5"/>
          <circle cx="44" cy="26" r="5"/>
          <circle cx="28" cy="22" r="5"/>
        </g>

      <div class="brand-word">
        <span>my peace</span>
        <span>of mind</span>

    <h1>Meta Ad Creatives</h1>

          <div class="tint-layer tint-dark"></div>

            <span>mypeaceofmind.com.au</span>

        </figcaption>

          <div class="tint-layer tint-gradient-up"></div>

              </div>
              <div class="stat-div"></div>

                <span class="stat-num">$0</span>

              </svg>
              <span class="logo-wordmark logo-wordmark-dark">my peace<br/>of mind</span>

            <span class="ad-eyebrow eyebrow-dark">CAR FINANCE</span>
            <h3 class="ad-title title-dark">Approved in 24 hours.<br/>Driving by the weekend.</h3>
            <p class="ad-sub sub-dark">We compare 60+ lenders to find your best rate — no obligation, no fuss.</p>
            <a class="ad-cta" href="#">START TODAY</a>

          <div class="land-right photo-car"></div>

    </div>
