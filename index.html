<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vauban — The Wealth Container Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 0L12.5 7.5H20L14 12.5L16.5 20L10 15.5L3.5 20L6 12.5L0 7.5H7.5L10 0Z" fill="white"/>
      </svg>
      <span class="nav-logo-text">VAUBAN</span>
    </div>
    <ul class="nav-links">
      <li><a href="#">CONTAINERS</a></li>
      <li><a href="#">LEARN</a></li>
      <li><a href="#">ABOUT US</a></li>
    </ul>
    <div class="nav-actions">
      <a href="#" class="btn-login">LOGIN</a>
      <a href="#" class="btn-get-started">GET STARTED</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">
        The Wealth Container<br />
        platform.
        <span class="hero-subtitle"> The easiest way<br />to launch your funds and SPVs.</span>
      </h1>
      <a href="#" class="hero-cta">Get started &rarr;</a>
    </div>
  </section>

  <!-- Process Flow -->
  <section class="process">
    <div class="process-divider"></div>
    <div class="process-steps">

      <!-- Step: Sign in -->
      <div class="step step-outside">
        <span class="step-label">Sign in</span>
        <div class="step-icon">
          <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Laptop body -->
            <rect x="15" y="20" width="90" height="58" rx="4" stroke="white" stroke-width="2"/>
            <rect x="22" y="27" width="76" height="44" stroke="white" stroke-width="1.5"/>
            <!-- Asterisk on screen -->
            <line x1="60" y1="42" x2="60" y2="58" stroke="#e05a2b" stroke-width="2.5"/>
            <line x1="52" y1="46" x2="68" y2="54" stroke="#e05a2b" stroke-width="2.5"/>
            <line x1="68" y1="46" x2="52" y2="54" stroke="#e05a2b" stroke-width="2.5"/>
            <!-- Base -->
            <path d="M5 78 H115 L108 88 H12 Z" stroke="white" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Connector line into box -->
      <div class="connector"></div>

      <!-- Process box -->
      <div class="process-box">
        <!-- Step: Pick -->
        <div class="step">
          <span class="step-label">Pick</span>
          <div class="step-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Box stack -->
              <rect x="30" y="50" width="40" height="30" stroke="white" stroke-width="2"/>
              <rect x="20" y="38" width="40" height="18" stroke="white" stroke-width="2"/>
              <rect x="40" y="26" width="30" height="18" stroke="white" stroke-width="2"/>
            </svg>
          </div>
        </div>

        <!-- Step: Tailor -->
        <div class="step">
          <span class="step-label">Tailor</span>
          <div class="step-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Gear 1 -->
              <circle cx="38" cy="55" r="14" stroke="white" stroke-width="2"/>
              <circle cx="38" cy="55" r="6" stroke="white" stroke-width="1.5"/>
              <rect x="35" y="36" width="6" height="8" rx="1" fill="white"/>
              <rect x="35" y="66" width="6" height="8" rx="1" fill="white"/>
              <rect x="19" y="52" width="8" height="6" rx="1" fill="white"/>
              <rect x="49" y="52" width="8" height="6" rx="1" fill="white"/>
              <rect x="24" y="40" width="6" height="8" rx="1" fill="white" transform="rotate(45 27 44)"/>
              <rect x="46" y="40" width="6" height="8" rx="1" fill="white" transform="rotate(-45 49 44)"/>
              <rect x="24" y="58" width="6" height="8" rx="1" fill="white" transform="rotate(-45 27 62)"/>
              <rect x="46" y="58" width="6" height="8" rx="1" fill="white" transform="rotate(45 49 62)"/>
              <!-- Gear 2 smaller -->
              <circle cx="62" cy="38" r="10" stroke="white" stroke-width="2"/>
              <circle cx="62" cy="38" r="4" stroke="white" stroke-width="1.5"/>
              <rect x="59" y="24" width="6" height="6" rx="1" fill="white"/>
              <rect x="59" y="46" width="6" height="6" rx="1" fill="white"/>
              <rect x="48" y="35" width="6" height="6" rx="1" fill="white"/>
              <rect x="70" y="35" width="6" height="6" rx="1" fill="white"/>
            </svg>
          </div>
        </div>

        <!-- Step: Legals -->
        <div class="step">
          <span class="step-label">Legals</span>
          <div class="step-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Document stack -->
              <rect x="28" y="20" width="44" height="58" rx="2" stroke="white" stroke-width="2"/>
              <rect x="22" y="26" width="44" height="58" rx="2" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <rect x="16" y="32" width="44" height="58" rx="2" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <!-- Lines on top doc -->
              <line x1="24" y1="46" x2="52" y2="46" stroke="#e05a2b" stroke-width="2"/>
              <line x1="24" y1="54" x2="52" y2="54" stroke="#e05a2b" stroke-width="1.5"/>
              <line x1="24" y1="62" x2="44" y2="62" stroke="#e05a2b" stroke-width="1.5"/>
            </svg>
          </div>
        </div>

        <!-- Step: Fundraise -->
        <div class="step">
          <span class="step-label">Fundraise</span>
          <div class="step-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Coin stack -->
              <ellipse cx="50" cy="72" rx="22" ry="7" stroke="white" stroke-width="2"/>
              <rect x="28" y="60" width="44" height="12" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <ellipse cx="50" cy="60" rx="22" ry="7" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <rect x="28" y="48" width="44" height="12" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <ellipse cx="50" cy="48" rx="22" ry="7" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <rect x="28" y="36" width="44" height="12" stroke="white" stroke-width="2" fill="#1a1a1a"/>
              <ellipse cx="50" cy="36" rx="22" ry="7" stroke="white" stroke-width="2"/>
              <!-- Bar chart above -->
              <rect x="38" y="18" width="6" height="14" stroke="white" stroke-width="1.5" fill="none"/>
              <rect x="48" y="10" width="6" height="22" stroke="white" stroke-width="1.5" fill="none"/>
              <rect x="58" y="14" width="6" height="18" stroke="white" stroke-width="1.5" fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Step: Invest -->
        <div class="step">
          <span class="step-label">Invest</span>
          <div class="step-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Container -->
              <rect x="20" y="52" width="60" height="28" rx="2" stroke="#e05a2b" stroke-width="2"/>
              <line x1="20" y1="60" x2="80" y2="60" stroke="#e05a2b" stroke-width="1.5"/>
              <line x1="40" y1="60" x2="40" y2="80" stroke="#e05a2b" stroke-width="1.5"/>
              <line x1="60" y1="60" x2="60" y2="80" stroke="#e05a2b" stroke-width="1.5"/>
              <!-- Arrows going up -->
              <line x1="35" y1="46" x2="35" y2="20" stroke="white" stroke-width="1.5"/>
              <polyline points="30,26 35,20 40,26" stroke="white" stroke-width="1.5" fill="none"/>
              <line x1="50" y1="46" x2="50" y2="15" stroke="white" stroke-width="1.5"/>
              <polyline points="45,21 50,15 55,21" stroke="white" stroke-width="1.5" fill="none"/>
              <line x1="65" y1="46" x2="65" y2="22" stroke="white" stroke-width="1.5"/>
              <polyline points="60,28 65,22 70,28" stroke="white" stroke-width="1.5" fill="none"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Connector line out of box -->
      <div class="connector"></div>

      <!-- Step: Deploy -->
      <div class="step step-outside">
        <span class="step-label">Deploy</span>
        <div class="step-icon">
          <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Globe -->
            <circle cx="60" cy="52" r="36" stroke="white" stroke-width="2"/>
            <!-- Latitude lines -->
            <ellipse cx="60" cy="52" rx="36" ry="14" stroke="white" stroke-width="1.5"/>
            <ellipse cx="60" cy="52" rx="20" ry="36" stroke="white" stroke-width="1.5"/>
            <line x1="24" y1="52" x2="96" y2="52" stroke="white" stroke-width="1.5"/>
            <line x1="60" y1="16" x2="60" y2="88" stroke="white" stroke-width="1.5"/>
            <!-- Expand arrows -->
            <polyline points="88,20 100,20 100,32" stroke="white" stroke-width="2" fill="none"/>
            <polyline points="32,80 20,80 20,68" stroke="white" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
